<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<h2>Checkout</h2>

<div class="container">
    <form th:action="@{/orders/place}" th:object="${order}" method="post">

        <label>Name:</label>
        <input type="text" th:field="*{customerName}" placeholder="Enter your name" required />

        <label>Address:</label>
        <input type="text" th:field="*{address}" placeholder="Enter your address" required />

        <button type="submit">Place Order</button>

    </form>
</div>

</body>
</html>
