<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register · Novella</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* NOVELLA BRAND IDENTITY — COMPLETE RESET + HEADER + REGISTRATION FORM */
        /* All Thymeleaf attributes and HTML structure preserved. Only CSS changed. */

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --cream:      #caba9c;
            --parchment:  #f0e9dc;
            --gold:       #4c6444;
            --gold-lt:    #d48e0c;
            --ink:        #4d2d18;
            --ink-mid:    #4d2d18;
            --ink-muted:  #000000;
            --border:     #4d2d18;
            --serif:      "Cormorant Garamond", Georgia, serif;
            --sans:       "DM Sans", sans-serif;
            --radius:     4px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--sans);
            background: var(--cream);
            color: var(--ink);
            line-height: 1.7;
            font-size: 16px;
            min-height: 100vh;
        }

        /* ========== HEADER (identical to book catalogue) ========== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--cream);
            border-bottom: 1px solid var(--border);
            padding: 0 5%;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            height: 72px;
        }

        .logo {
            display: flex;
            flex-direction: column;
            line-height: 1;
            text-decoration: none;
        }

        .logo-word {
            font-family: var(--serif);
            font-size: 30px;
            font-weight: 300;
            letter-spacing: 0.12em;
            color: var(--ink);
        }

        .logo-tagline {
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--gold-lt);
            margin-top: 2px;
        }

        nav {
            display: flex;
            gap: 36px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-mid);
            transition: color 0.2s;
        }

        nav a:hover, nav a.active { color: var(--gold); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--ink-mid);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            text-decoration: none;
        }

        .icon-btn:hover { color: var(--gold); }

        .btn-primary {
            background: var(--gold);
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: var(--radius);
            transition: background 0.2s, transform 0.15s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover {
            background: var(--gold-lt);
            transform: translateY(-1px);
        }

        /* ========== PAGE HERO (compact but elegant) ========== */
        .page-hero {
            background: var(--ink);
            color: #fff;
            padding: 48px 5% 44px;
            text-align: center;
            border-bottom: 3px solid var(--gold-lt);
        }

        .page-hero-eyebrow {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--gold-lt);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .page-hero-eyebrow::before,
        .page-hero-eyebrow::after {
            content: "";
            display: block;
            width: 40px;
            height: 1px;
            background: var(--gold-lt);
            opacity: 0.5;
        }

        .page-hero h1 {
            font-family: var(--serif);
            font-size: clamp(38px, 5vw, 58px);
            font-weight: 300;
            line-height: 1.1;
            color: #fff;
            margin-bottom: 12px;
        }

        .page-hero h1 em {
            font-style: italic;
            color: var(--gold-lt);
        }

        .page-hero p {
            font-size: 14px;
            color: rgba(255,255,255,0.55);
            max-width: 460px;
            margin: 0 auto;
        }

        /* ========== REGISTRATION CARD (compact, matches Novella aesthetics) ========== */
        .register-container {
            max-width: 620px;
            margin: 48px auto 80px;
            padding: 0 24px;
        }

        .register-card {
            background: var(--parchment);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 16px 32px rgba(77, 45, 24, 0.1);
            padding: 32px 40px;
            transition: box-shadow 0.2s;
        }

        .register-card:hover {
            box-shadow: 0 24px 40px rgba(77, 45, 24, 0.15);
        }

        /* form grid – two columns for compactness, but keeps original order on mobile */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 20px;
        }

        /* full-width fields (address, password) can span */
        .full-width {
            grid-column: span 2;
        }

        .field-group {
            display: flex;
            flex-direction: column;
        }

        .field-group label {
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink);
            margin-bottom: 4px;
        }

        .field-group input {
            background: white;
            border: 1px solid rgba(77, 45, 24, 0.3);
            border-radius: var(--radius);
            padding: 8px 12px;
            font-family: var(--sans);
            font-size: 14px;
            color: var(--ink);
            transition: all 0.2s;
            width: 100%;
        }

        .field-group input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(76, 100, 68, 0.2);
        }

        /* submit button area */
        .form-actions {
            margin-top: 28px;
            text-align: center;
        }

        .register-btn {
            background: var(--gold);
            color: white;
            border: none;
            padding: 12px 28px;
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            width: 100%;
            max-width: 260px;
        }

        .register-btn:hover {
            background: var(--gold-lt);
            transform: translateY(-1px);
        }

        .home-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--gold);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }

        .home-link:hover {
            color: var(--gold-lt);
            border-bottom-color: var(--gold-lt);
        }

        /* footer (matching book catalogue) */
        footer {
            background: var(--ink);
            color: rgba(255,255,255,0.7);
            padding: 48px 5% 0;
            margin-top: 40px;
        }

        .footer-bottom {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-copy { font-size: 12px; color: rgba(255,255,255,0.3); }

        .footer-legal { display: flex; gap: 24px; }

        .footer-legal a {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-legal a:hover { color: rgba(255,255,255,0.6); }

        /* responsive: on small screens, grid becomes single column */
        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .full-width {
                grid-column: span 1;
            }
            .register-card {
                padding: 24px 20px;
            }
            .header-inner nav {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .register-container {
                margin: 32px auto 60px;
                padding: 0 16px;
            }
        }

        /* subtle texture overlay (like catalogue) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(77,45,24,0.02) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
        }

        .register-container, header, footer, .page-hero {
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>

<!-- ══ NOVELLA HEADER (identical to catalogue) ══ -->
<header>
    <div class="header-inner">
        <a class="logo" th:href="@{/home}">
            <span class="logo-word">Novella</span>
            <span class="logo-tagline">A World of Stories</span>
        </a>
        <nav>
            <a th:href="@{/home}">Home</a>
            <a th:href="@{/books}">Books</a>
            <a th:href="@{/books/search}">Search</a>
        </nav>
        <div class="header-actions">
            <a th:href="@{/books/search}" class="icon-btn" title="Search">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </a>
            <a th:href="@{/cart/view}" class="icon-btn" title="Cart">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <path d="M16 10a4 4 0 0 1-8 0"/>
                </svg>
            </a>
            <a th:if="${session.loggedCustomer == null}" th:href="@{/customer/login}" class="btn-primary">Sign In</a>
            <a th:if="${session.loggedCustomer != null}" th:href="@{/customer/profile}" class="btn-primary">Profile</a>
        </div>
    </div>
</header>

<!-- ══ PAGE HERO (registration specific but matches Novella tone) ══ -->
<div class="page-hero">
    <p class="page-hero-eyebrow">Join the Novella community</p>
    <h1>Create an <em>account</em></h1>
    <p>Become a member and start your literary journey with us.</p>
</div>

<!-- ══ REGISTRATION FORM (original fields, new compact layout, no extra spaces) ══ -->
<div class="register-container">
    <div class="register-card">
        <form method="post" action="#" th:action="@{/customer/register}" th:object="${customer}">
            <!-- Two-column grid eliminates large gaps, keeps all original fields -->
            <div class="form-grid">
                <!-- FirstName -->
                <div class="field-group">
                    <label>First name</label>
                    <input type="text" name="firstName" th:field="*{firstName}" required>
                </div>
                <!-- LastName -->
                <div class="field-group">
                    <label>Last name</label>
                    <input type="text" name="lastName" th:field="*{lastName}" required>
                </div>
                <!-- Email -->
                <div class="field-group full-width">
                    <label>Email address</label>
                    <input type="email" name="email" th:field="*{email}" required>
                </div>
                <!-- Phone -->
                <div class="field-group full-width">
                    <label>Phone number</label>
                    <input type="text" name="phoneNumber" th:field="*{phoneNumber}" required>
                </div>
                <!-- Province -->
                <div class="field-group">
                    <label>Province</label>
                    <input type="text" name="Province" th:field="*{province}" required>
                </div>
                <!-- Country -->
                <div class="field-group">
                    <label>Country</label>
                    <input type="text" name="Country" th:field="*{country}" required>
                </div>
                <!-- PostalCode -->
                <div class="field-group">
                    <label>Postal code</label>
                    <input type="text" name="postalCode" th:field="*{postalCode}" required>
                </div>
                <!-- StreetNumber -->
                <div class="field-group">
                    <label>Street number</label>
                    <input type="text" name="streetNumber" th:field="*{streetNumber}" required>
                </div>
                <!-- StreetName (full width) -->
                <div class="field-group full-width">
                    <label>Street name</label>
                    <input type="text" name="streetName" th:field="*{streetName}" required>
                </div>
                <!-- Password (full width) -->
                <div class="field-group full-width">
                    <label>Password</label>
                    <input type="password" name="password" th:field="*{password}" required>
                </div>
            </div>

            <div class="form-actions">
                <input type="submit" value="Register" class="register-btn">
                <br>
                <a href="/home" class="home-link">← Go back to home page</a>
            </div>
        </form>
    </div>
</div>

<!-- ══ FOOTER (same as catalogue) ══ -->
<footer>
    <div class="footer-bottom">
        <p class="footer-copy">© 2025 Novella Bookstore. All rights reserved.</p>
        <div class="footer-legal">
            <a th:href="@{/home}">Home</a>
            <a th:href="@{/books}">Books</a>
            <a th:href="@{/books/search}">Search</a>
        </div>
    </div>
</footer>

</body>
</html>
