<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Novella</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #caba9c;
            --parchment: #f0e9dc;
            --gold: #4c6444;
            --gold-lt: #d48e0c;
            --ink: #4d2d18;
            --ink-mid: #4d2d18;
            --ink-muted: #000000;
            --border: #4d2d18;
            --serif: "Cormorant Garamond", Georgia, serif;
            --sans: "DM Sans", sans-serif;
            --radius: 4px;
        }

        body {
            font-family: var(--sans);
            background: var(--cream);
            color: var(--ink);
            line-height: 1.7;
            font-size: 16px;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--cream);
            border-bottom: 1px solid var(--border);
            padding: 0 5%;
            margin-bottom: 40px;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            height: 72px;
        }

        .logo {
            display: flex;
            flex-direction: column;
            line-height: 1;
            text-decoration: none;
        }

        .logo-word {
            font-family: var(--serif);
            font-size: 30px;
            font-weight: 300;
            letter-spacing: 0.12em;
            color: var(--ink);
        }

        .logo-tagline {
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--gold-lt);
            margin-top: 2px;
        }

        nav {
            display: flex;
            gap: 36px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-mid);
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--gold);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--ink-mid);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            text-decoration: none;
        }

        .icon-btn:hover {
            color: var(--gold);
        }

        .btn-primary {
            background: var(--gold);
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: var(--radius);
            transition: background 0.2s, transform 0.15s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover {
            background: var(--gold-lt);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 10px 24px;
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: var(--radius);
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-secondary:hover {
            background: var(--gold);
            color: #fff;
        }

        .btn-danger {
            background: transparent;
            color: #842029;
            border: 1px solid #842029;
            padding: 10px 24px;
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: var(--radius);
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-danger:hover {
            background: #842029;
            color: #fff;
            border-color: #842029;
        }

        /* Main Container */
        .main-box {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            background: var(--parchment);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        /* Header */
        .box-header {
            background: var(--ink);
            padding: 24px;
            text-align: center;
            border-bottom: 3px solid var(--gold);
        }

        .box-header h1 {
            font-family: var(--serif);
            color: #fff;
            margin: 0;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .box-header p {
            color: var(--gold-lt);
            margin: 8px 0 0;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Profile Hero Section */
        .profile-hero {
            background: var(--cream);
            padding: 24px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .hero-text h2 {
            font-family: var(--serif);
            margin: 0;
            color: var(--ink);
            font-size: 24px;
            font-weight: 400;
        }

        .hero-text span {
            font-size: 13px;
            color: var(--gold);
            font-weight: 500;
        }

        .id-badge {
            display: inline-block;
            background: var(--gold);
            color: #fff;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-top: 8px;
        }

        /* Content Area */
        .box-content {
            padding: 30px;
        }

        /* Section Titles */
        .section-title {
            color: var(--ink);
            border-bottom: 2px solid var(--gold);
            padding-bottom: 8px;
            margin: 24px 0 16px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-family: var(--sans);
        }

        .section-title:first-of-type {
            margin-top: 0;
        }

        /* Grid Layout */
        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            color: var(--ink);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .field .value {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 12px;
            font-size: 14px;
            color: var(--ink);
            min-height: 42px;
            display: flex;
            align-items: center;
            font-family: var(--sans);
        }

        /* Input Fields */
        .field input[type="text"],
        .field input[type="email"],
        .field input[type="tel"] {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 12px;
            font-size: 14px;
            color: var(--ink);
            width: 100%;
            font-family: var(--sans);
            transition: all 0.2s;
        }

        .field input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(76, 100, 68, 0.1);
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        /* Alert Banners */
        .banner {
            border-radius: var(--radius);
            padding: 12px 16px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .banner-success {
            background: #d1e7dd;
            color: #0a3622;
            border: 1px solid #a3cfbb;
        }

        .banner-error {
            background: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }

        /* Footer Navigation */
        .footer-nav {
            text-align: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            letter-spacing: 0.05em;
        }

        .footer-nav a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            margin: 0 12px;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.1em;
        }

        .footer-nav a:hover {
            color: var(--gold-lt);
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                display: none;
            }
            .header-inner {
                flex-wrap: wrap;
                height: auto;
                padding: 15px 0;
            }
            .profile-hero {
                flex-direction: column;
                text-align: center;
            }
            .field-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .btn-row {
                flex-direction: column;
            }
            .btn-row .btn-primary,
            .btn-row .btn-danger {
                text-align: center;
            }
            .footer-nav a {
                display: inline-block;
                margin: 5px 8px;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }
            .box-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<!-- Header matching homepage -->
<header>
    <div class="header-inner">
        <a class="logo" th:href="@{/home}">
            <span class="logo-word">Novella</span>
            <span class="logo-tagline">A World of Stories</span>
        </a>
        <nav>
            <a th:href="@{/home}">Home</a>
            <a th:href="@{/books}">Books</a>
            <a th:href="@{/orders/history}">My Orders</a>
        </nav>
        <div class="header-actions">
            <a th:href="@{/cart/view}" class="icon-btn" title="Cart">🛒</a>
            <a th:href="@{/customer/profile}" class="btn-primary">My Profile</a>
        </div>
    </div>
</header>

<!-- Main Content -->
<div class="main-box">
    <div class="box-header">
        <h1>Novella</h1>
        <p>My Account Profile</p>
    </div>

    <div class="profile-hero">
        <div class="hero-text">
            <h2>
                <span th:text="${customer.firstName}">First</span>
                <span th:text="${customer.lastName}">Last</span>
            </h2>
            <span class="id-badge">Member #<span th:text="${customer.customerID}">000</span></span>
        </div>
    </div>

    <div class="box-content">
        <!-- Alert Messages -->
        <div class="banner banner-success" th:if="${success}" th:text="${success}"></div>
        <div class="banner banner-error" th:if="${error}" th:text="${error}"></div>

        <!-- View Mode -->
        <div th:if="${editMode == null or !editMode}">
            <div class="section-title">Personal Information</div>
            <div class="field-grid">
                <div class="field">
                    <label>First Name</label>
                    <div class="value" th:text="${customer.firstName}">-</div>
                </div>
                <div class="field">
                    <label>Last Name</label>
                    <div class="value" th:text="${customer.lastName}">-</div>
                </div>
                <div class="field">
                    <label>Phone Number</label>
                    <div class="value" th:text="${customer.phoneNumber}">-</div>
                </div>
            </div>

            <div class="section-title">Address</div>
            <div class="field-grid">
                <div class="field">
                    <label>Street Number</label>
                    <div class="value" th:text="${customer.streetNumber}">-</div>
                </div>
                <div class="field">
                    <label>Street Name</label>
                    <div class="value" th:text="${customer.streetName}">-</div>
                </div>
                <div class="field">
                    <label>Postal Code</label>
                    <div class="value" th:text="${customer.postalCode}">-</div>
                </div>
                <div class="field">
                    <label>Province</label>
                    <div class="value" th:text="${customer.province}">-</div>
                </div>
                <div class="field">
                    <label>Country</label>
                    <div class="value" th:text="${customer.country}">-</div>
                </div>
            </div>

            <div class="btn-row">
                <a th:href="@{/customer/profile/edit}" class="btn-primary">Edit Profile</a>
                <a th:href="@{/customer/logout}" class="btn-danger">Logout</a>
            </div>
        </div>

        <!-- Edit Mode -->
        <div th:if="${editMode == true}">
            <form th:action="@{/customer/profile/update}" th:object="${customer}" method="post">
                <input type="hidden" th:field="*{customerID}">

                <div class="section-title">Personal Information</div>
                <div class="field-grid">
                    <div class="field">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" th:field="*{firstName}" required>
                    </div>
                    <div class="field">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" th:field="*{lastName}" required>
                    </div>
                    <div class="field">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="tel" id="phoneNumber" th:field="*{phoneNumber}">
                    </div>
                </div>

                <div class="section-title">Address</div>
                <div class="field-grid">
                    <div class="field">
                        <label for="streetNumber">Street Number</label>
                        <input type="text" id="streetNumber" th:field="*{streetNumber}">
                    </div>
                    <div class="field">
                        <label for="streetName">Street Name</label>
                        <input type="text" id="streetName" th:field="*{streetName}">
                    </div>
                    <div class="field">
                        <label for="postalCode">Postal Code</label>
                        <input type="text" id="postalCode" th:field="*{postalCode}">
                    </div>
                    <div class="field">
                        <label for="province">Province</label>
                        <input type="text" id="province" th:field="*{province}">
                    </div>
                    <div class="field">
                        <label for="country">Country</label>
                        <input type="text" id="country" th:field="*{country}">
                    </div>
                </div>

                <div class="btn-row">
                    <input type="submit" class="btn-primary" value="Save Changes">
                    <a th:href="@{/customer/profile}" class="btn-secondary">Cancel</a>
                </div>
            </form>
        </div>

        <!-- Footer Navigation - FIXED: Now links to /orders/my-orders -->
        <div class="footer-nav">
            <a th:href="@{/home}">Home</a>
            <a th:href="@{/orders/history}">My Orders</a>
            <a th:href="@{/customer/logout}">Logout</a>
        </div>
    </div>
</div>

</body>
</html>
