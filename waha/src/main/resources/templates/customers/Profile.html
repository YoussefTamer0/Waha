<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Profile</title>
    <style>
        * {
            font-family: 'Times New Roman', Times, serif;
            box-sizing: border-box;
        }
        body {
            background-image: url('/images/backgroundimage.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(76, 100, 68, 0.7);
            z-index: -1;
        }
        .main-box {
            background: #CABA9C;
            max-width: 620px;
            width: 100%;
            margin: 0 auto;
            border-radius: 16px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            overflow: hidden;
            border-top: 5px solid #8A6240;
        }
        .box-header {
            background: #4C6444;
            padding: 14px 24px;
            text-align: center;
        }
        .box-header h1 {
            color: #CABA9C;
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }
        .box-header p {
            color: #CABA9C;
            margin: 4px 0 0;
            font-size: 11px;
            opacity: 0.85;
        }
        .profile-hero {
            background: #b5a58a;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 24px;
            border-bottom: 2px solid #8A6240;
        }
        .hero-text h2 {
            margin: 0;
            color: #4D2D18;
            font-size: 17px;
            font-weight: 700;
        }
        .hero-text span {
            font-size: 11px;
            color: #4C6444;
            font-weight: 600;
        }
        .box-content {
            padding: 20px 24px 24px;
        }
        .section-title {
            color: #4D2D18;
            border-bottom: 2px solid #B69803;
            padding-bottom: 5px;
            margin: 18px 0 12px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .section-title:first-of-type {
            margin-top: 0;
        }
        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
        }
        .field-grid.single {
            grid-template-columns: 1fr;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .field label {
            color: #4D2D18;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .field .value {
            background: #d9cdb8;
            border: 1px solid #b5a58a;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            color: #2e1a0e;
            min-height: 32px;
            display: flex;
            align-items: center;
        }
        .field input[type="text"],
        .field input[type="email"],
        .field input[type="tel"] {
            background: #fff;
            border: 1px solid #8A6240;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            color: #2e1a0e;
            width: 100%;
            transition: border-color 0.2s;
        }
        .field input:focus {
            outline: none;
            border-color: #4C6444;
            box-shadow: 0 0 0 2px rgba(76,100,68,0.18);
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 9px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            font-family: 'Times New Roman', Times, serif;
            transition: background 0.25s ease;
        }
        .btn-primary {
            background: #4C6444;
            color: #CABA9C;
        }
        .btn-primary:hover {
            background: #102820;
        }
        .btn-secondary {
            background: #8A6240;
            color: #CABA9C;
        }
        .btn-secondary:hover {
            background: #4D2D18;
        }
        .btn-danger {
            background: transparent;
            color: #8A6240;
            border: 1.5px solid #8A6240;
        }
        .btn-danger:hover {
            background: #4D2D18;
            color: #CABA9C;
            border-color: #4D2D18;
        }
        .banner {
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            margin-bottom: 14px;
            text-align: center;
        }
        .banner-success {
            background: #d1e7dd;
            color: #0a3622;
            border: 1px solid #a3cfbb;
        }
        .banner-error {
            background: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }
        .footer-nav {
            text-align: center;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #8A6240;
            font-size: 12px;
            color: #4D2D18;
        }
        .footer-nav a {
            color: #8A6240;
            text-decoration: none;
            font-weight: 700;
            margin: 0 8px;
        }
        .footer-nav a:hover {
            text-decoration: underline;
            color: #4D2D18;
        }
        .id-badge {
            display: inline-block;
            background: #4C6444;
            color: #CABA9C;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 2px;
        }
    </style>
</head>
<body>
<div class="overlay"></div>
<div class="main-box">
    <div class="box-header">
        <h1>Bookstore</h1>
        <p>My Account Profile</p>
    </div>
    <div class="profile-hero">
        <div class="hero-text">
            <h2>
                <span th:text="${customer.firstName}">First</span>
                <span th:text="${customer.lastName}">Last</span>
            </h2>
            <span class="id-badge">ID #<span th:text="${customer.customerID}">000</span></span>
        </div>
    </div>
    <div class="box-content">
        <div class="banner banner-success" th:if="${success}" th:text="${success}"></div>
        <div class="banner banner-error" th:if="${error}" th:text="${error}"></div>
        <div th:if="${editMode == null or !editMode}">
            <div class="section-title">Personal Information</div>
            <div class="field-grid">
                <div class="field">
                    <label>First Name</label>
                    <div class="value" th:text="${customer.firstName}">-</div>
                </div>
                <div class="field">
                    <label>Last Name</label>
                    <div class="value" th:text="${customer.lastName}">-</div>
                </div>
                <div class="field">
                    <label>Phone Number</label>
                    <div class="value" th:text="${customer.phoneNumber}">-</div>
                </div>
            </div>
            <div class="section-title">Address</div>
            <div class="field-grid">
                <div class="field">
                    <label>Street Number</label>
                    <div class="value" th:text="${customer.streetNumber}">-</div>
                </div>
                <div class="field">
                    <label>Street Name</label>
                    <div class="value" th:text="${customer.streetName}">-</div>
                </div>
                <div class="field">
                    <label>Postal Code</label>
                    <div class="value" th:text="${customer.postalCode}">-</div>
                </div>
                <div class="field">
                    <label>Province</label>
                    <div class="value" th:text="${customer.province}">-</div>
                </div>
                <div class="field">
                    <label>Country</label>
                    <div class="value" th:text="${customer.country}">-</div>
                </div>
            </div>
            <div class="btn-row">
                <a th:href="@{/customer/profile/edit}" class="btn btn-primary" style="text-align:center;text-decoration:none;">Edit Profile</a>
                <a th:href="@{/customer/logout}" class="btn btn-danger" style="text-align:center;text-decoration:none;">Logout</a>
            </div>
        </div>
        <div th:if="${editMode == true}">
            <form th:action="@{/customer/profile/update}" th:object="${customer}" method="post">
                <input type="hidden" th:field="*{customerID}">
                <div class="section-title">Personal Information</div>
                <div class="field-grid">
                    <div class="field">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" th:field="*{firstName}" required>
                    </div>
                    <div class="field">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" th:field="*{lastName}" required>
                    </div>
                    <div class="field">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="tel" id="phoneNumber" th:field="*{phoneNumber}">
                    </div>
                </div>
                <div class="section-title">Address</div>
                <div class="field-grid">
                    <div class="field">
                        <label for="streetNumber">Street Number</label>
                        <input type="text" id="streetNumber" th:field="*{streetNumber}">
                    </div>
                    <div class="field">
                        <label for="streetName">Street Name</label>
                        <input type="text" id="streetName" th:field="*{streetName}">
                    </div>
                    <div class="field">
                        <label for="postalCode">Postal Code</label>
                        <input type="text" id="postalCode" th:field="*{postalCode}">
                    </div>
                    <div class="field">
                        <label for="province">Province</label>
                        <input type="text" id="province" th:field="*{province}">
                    </div>
                    <div class="field">
                        <label for="country">Country</label>
                        <input type="text" id="country" th:field="*{country}">
                    </div>
                </div>
                <div class="btn-row">
                    <input type="submit" class="btn btn-primary" value="Save Changes">
                    <a th:href="@{/customer/profile}" class="btn btn-secondary" style="text-align:center;text-decoration:none;">Cancel</a>
                </div>
            </form>
        </div>
        <div class="footer-nav">
            <a th:href="@{/home}">Home</a>
            <a th:href="@{/orders}">My Orders</a>
        </div>
    </div>
</div>
</body>
</html>
