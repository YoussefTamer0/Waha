<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Novella</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #caba9c;
            --parchment: #f0e9dc;
            --gold: #4c6444;
            --gold-lt: #d48e0c;
            --ink: #4d2d18;
            --ink-mid: #4d2d18;
            --ink-muted: #000000;
            --border: #4d2d18;
            --serif: "Cormorant Garamond", Georgia, serif;
            --sans: "DM Sans", sans-serif;
            --radius: 4px;
        }

        body {
            font-family: var(--sans);
            background: var(--cream);
            color: var(--ink);
            line-height: 1.7;
            font-size: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--cream);
            border-bottom: 1px solid var(--border);
            padding: 0 5%;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            height: 72px;
        }

        .logo {
            display: flex;
            flex-direction: column;
            line-height: 1;
            text-decoration: none;
        }

        .logo-word {
            font-family: var(--serif);
            font-size: 30px;
            font-weight: 300;
            letter-spacing: 0.12em;
            color: var(--ink);
        }

        .logo-tagline {
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--gold-lt);
            margin-top: 2px;
        }

        nav {
            display: flex;
            gap: 36px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-mid);
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--gold);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--ink-mid);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            text-decoration: none;
        }

        .icon-btn:hover {
            color: var(--gold);
        }

        .btn-primary {
            background: var(--gold);
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: var(--radius);
            transition: background 0.2s, transform 0.15s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover {
            background: var(--gold-lt);
            transform: translateY(-1px);
        }

        /* Main Container */
        .main-box {
            max-width: 450px;
            width: 100%;
            margin: 80px auto 0;
            background: var(--parchment);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        /* Header */
        .box-header {
            background: var(--ink);
            padding: 24px;
            text-align: center;
            border-bottom: 3px solid var(--gold);
        }

        .box-header h1 {
            font-family: var(--serif);
            color: #fff;
            margin: 0;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .box-header p {
            color: var(--gold-lt);
            margin: 8px 0 0;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Content Area */
        .box-content {
            padding: 30px;
        }

        .form-section h3 {
            font-family: var(--serif);
            color: var(--ink);
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 400;
            text-align: center;
        }

        /* Form Fields */
        label {
            color: var(--ink);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: block;
            text-align: left;
            margin-top: 16px;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            font-family: var(--sans);
            background: #fff;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(76, 100, 68, 0.1);
        }

        button[type="submit"] {
            background: var(--gold);
            color: #fff;
            border: none;
            padding: 12px 24px;
            width: 100%;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: var(--sans);
            margin-top: 24px;
            transition: all 0.2s;
        }

        button[type="submit"]:hover {
            background: var(--gold-lt);
            transform: translateY(-1px);
        }

        /* Error Message */
        .error {
            color: #842029;
            font-size: 12px;
            text-align: center;
            margin-top: 16px;
            padding: 10px;
            background: #f8d7da;
            border-radius: var(--radius);
            border: 1px solid #f5c2c7;
        }

        /* Links */
        .login-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .login-link a {
            color: var(--gold);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .login-link a:hover {
            color: var(--gold-lt);
            text-decoration: underline;
        }

        .note {
            font-size: 10px;
            color: var(--ink-muted);
            text-align: center;
            margin-top: 16px;
            opacity: 0.7;
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                display: none;
            }
            .header-inner {
                padding: 0 15px;
            }
            .main-box {
                margin-top: 100px;
            }
            .box-content {
                padding: 24px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px;
            }
            .main-box {
                margin-top: 80px;
            }
            .box-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<!-- Header matching homepage -->
<header>
    <div class="header-inner">
        <a class="logo" th:href="@{/home}">
            <span class="logo-word">Novella</span>
            <span class="logo-tagline">A World of Stories</span>
        </a>
        <nav>
            <a th:href="@{/home}">Home</a>
            <a th:href="@{/books}">Books</a>
        </nav>
        <div class="header-actions">
            <a th:href="@{/customer/login}" class="btn-primary">Sign In</a>
        </div>
    </div>
</header>

<!-- Login Form -->
<div class="main-box">
    <div class="box-header">
        <h1>Novella</h1>
        <p>Sign In to Your Account</p>
    </div>

    <div class="box-content">
        <div class="form-section">
            <h3>Welcome Back</h3>

            <form action="/customer/login" method="post">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="your@email.com">

                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter your password">

                <button type="submit">Sign In</button>
            </form>

            <div class="error" th:if="${error}" th:text="${error}"></div>
        </div>

        <div class="login-link">
            <a th:href="@{/customer/register}">Don't have an account? Create one →</a>
        </div>
        <div class="login-link">
            <a th:href="@{/home}">← Back to Home</a>
        </div>
        <div class="note">
            Experience a world of stories
        </div>
    </div>
</div>

</body>
</html>
