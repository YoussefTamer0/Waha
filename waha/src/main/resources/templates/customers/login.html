<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Bookstore</title>

    <style>
        * {
            font-family: 'Times New Roman', Times, serif;
        }

        body{
            background-image: url('backgroundimage.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .main-box {
            background: #CABA9C;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
            border-radius: 16px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            overflow: hidden;
            border-top: 5px solid #8A6240;
        }

        .box-header {
            background: #4C6444;
            padding: 12px 20px;
            text-align: center;
        }

        .box-header h1 {
            color: #CABA9C;
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .box-header p {
            color: #CABA9C;
            margin: 3px 0 0;
            font-size: 11px;
        }

        .box-content {
            padding: 18px 22px;
        }

        .form-section h3 {
            color: #4D2D18;
            border-bottom: 2px solid #B69803;
            padding-bottom: 5px;
            margin-bottom: 10px;
            font-size: 15px;
            text-align: center;
            font-weight: 600;
        }

        label{
            color:  #4D2D18;
            font-size: 11px;
            font-weight: 600;
            display: block;
            text-align: left;
            margin-top: 6px;
            margin-bottom: 3px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"]{
            width: 100%;
            padding: 6px 8px;
            border: 1px solid  #CABA9C;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
            font-weight: 400;
        }

        input[type="submit"],
        button[type="submit"]{
            background: #4C6444;
            color: #CABA9C;
            border: none;
            padding: 8px 20px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            margin-top: 12px;
            transition: background 0.3s ease;
        }

        input[type="submit"]:hover,
        button[type="submit"]:hover{
            background: #102820;
        }

        .login-link {
            text-align: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #8A6240;
            font-size: 12px;
        }

        .login-link a {
            color: #8A6240;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
            color: #4D2D18;
        }

        .note {
            font-size: 9px;
            color: #4C6444;
            text-align: center;
            margin-top: 10px;
        }

        .error {
            color: red;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            background: rgba(255,0,0,0.1);
            border-radius: 4px;
        }

        input, button, select, textarea {
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>
<div class="overlay"></div>

<div class="main-box">
    <div class="box-header">
        <h1>Bookstore Customer Login</h1>
        <p>Login into your account</p>
    </div>

    <div class="box-content">
        <div class="form-section">
            <h3>Login your information</h3>
            <form action="/customer/login" method="post">
                <label>Email:</label>
                <input type="email" name="email" required/>

                <label>Password:</label>
                <input type="password" name="password" required/>

                <button type="submit">Login</button>
            </form>

            <div class="error" th:if="${error}" th:text="${error}"></div>
        </div>

        <div class="login-link">
            have an account? <a th:href="@{/customer/register}">Sign up here</a>
        </div>
        <div class="login-link">
            <a th:href="@{/home}">← Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
