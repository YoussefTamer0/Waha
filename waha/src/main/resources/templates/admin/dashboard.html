<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard | Bookstore</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #ECE6D8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #340B01;
        }

        .app-container { display: flex; min-height: 100vh; }

        .sidebar {
            width: 260px;
            background-color: #340B01;
            color: #ECE6D8;
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
        }

        .sidebar h2 {
            color: #BED4C2;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 2px solid #6B4028;
        }

        .sidebar nav ul { list-style: none; }
        .sidebar nav ul li { margin-bottom: 15px; }
        .sidebar nav ul li a {
            color: #ECE6D8;
            text-decoration: none;
            display: block;
            padding: 10px 15px;
            border-radius: 8px;
        }
        .sidebar nav ul li a:hover { background-color: #6B4028; }
        .sidebar nav ul li a.active {
            background-color: #7B967A;
            color: #340B01;
            font-weight: bold;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px 30px;
        }

        h1 {
            color: #340B01;
            border-left: 5px solid #7B967A;
            padding-left: 20px;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #BED4C2;
        }

        .stat-number {
            font-size: 42px;
            font-weight: bold;
            color: #340B01;
            margin: 10px 0;
        }

        .stat-label {
            color: #6B4028;
            font-size: 14px;
            text-transform: uppercase;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .action-btn {
            background: white;
            padding: 30px;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid #BED4C2;
            transition: all 0.3s;
        }

        .action-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(52,11,1,0.1);
        }

        .action-btn span {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }

        .action-btn h3 {
            color: #340B01;
            margin-bottom: 5px;
        }

        .action-btn p {
            color: #6B4028;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="app-container">

    <aside class="sidebar">
        <h2>📚 Bookstore Admin</h2>
        <nav>
            <ul>
                <li><a href="/admin/dashboard" class="active">📊 Dashboard</a></li>
                <li><a href="/admin/managebooks">📖 Manage Books</a></li>
                <li><a href="/admin/ManageOrders">📦 Manage Orders</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <h1>📊 Admin Dashboard</h1>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Books</div>
                <div class="stat-number" th:text="${totalBooks}">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Total Orders</div>
                <div class="stat-number" th:text="${totalOrders}">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Total Revenue</div>
                <div class="stat-number" th:text="'$' + ${totalRevenue}">$0</div>
            </div>
        </div>

        <h2 style="margin-bottom: 20px;">⚡ Quick Actions</h2>

        <div class="quick-actions">
            <a href="/admin/managebooks" class="action-btn">
                <span>📖</span>
                <h3>Manage Books</h3>
                <p>Add, or remove books</p>
            </a>

            <a href="/admin/ManageOrders" class="action-btn">
                <span>📦</span>
                <h3>Manage Orders</h3>
                <p>View and process orders</p>
            </a>
        </div>
    </main>
</div>
</body>
</html>
